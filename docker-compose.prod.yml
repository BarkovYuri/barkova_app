services:
  db:
    image: postgres:16
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NOTE: healthcheck для db/redis в prod не задан намеренно — добавление
    # требует пересоздания контейнеров (manifest changed → recreate). В dev
    # это есть в docker-compose.yml. Включить в prod отдельной задачей с
    # управляемым окном обслуживания.

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly no
    volumes:
      - redis_data:/data

  postgres_backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_EXTRA_OPTS: "-Z9 --schema=public --blobs"
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: "7"
      BACKUP_KEEP_WEEKS: "4"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    volumes:
      - postgres_backups:/backups
    depends_on:
      - db

  backend:
    image: ghcr.io/barkovyuri/barkova_app-backend:latest
    restart: always
    env_file:
      - .env
    environment:
      # Прокси для исходящих к Telegram API (Роскомнадзор блокирует
      # api.telegram.org для российских хостингов). Если TELEGRAM_PROXY_URL
      # пустой — прокси не используется.
      HTTPS_PROXY: ${TELEGRAM_PROXY_URL:-}
      HTTP_PROXY: ${TELEGRAM_PROXY_URL:-}
      NO_PROXY: localhost,127.0.0.1,backend,db,redis,frontend,nginx,celery_worker,celery_beat,api.vk.com,id.vk.ru
    depends_on:
      - db
      - redis
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/healthz/', timeout=3).getcode()==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  celery_worker:
    image: ghcr.io/barkovyuri/barkova_app-backend:latest
    restart: always
    env_file:
      - .env
    environment:
      HTTPS_PROXY: ${TELEGRAM_PROXY_URL:-}
      HTTP_PROXY: ${TELEGRAM_PROXY_URL:-}
      NO_PROXY: localhost,127.0.0.1,backend,db,redis,frontend,nginx,celery_worker,celery_beat,api.vk.com,id.vk.ru
    depends_on:
      - db
      - redis
      - backend
    command: celery -A config worker -l info
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  celery_beat:
    image: ghcr.io/barkovyuri/barkova_app-backend:latest
    restart: always
    env_file:
      - .env
    environment:
      HTTPS_PROXY: ${TELEGRAM_PROXY_URL:-}
      HTTP_PROXY: ${TELEGRAM_PROXY_URL:-}
      NO_PROXY: localhost,127.0.0.1,backend,db,redis,frontend,nginx,celery_worker,celery_beat,api.vk.com,id.vk.ru
    depends_on:
      - db
      - redis
      - backend
    command: celery -A config beat -l info

  frontend:
    image: ghcr.io/barkovyuri/barkova_app-frontend:latest
    restart: always
    env_file:
      - .env
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx:/etc/nginx/conf.d
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  postgres_backups:
