[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [
    "migrations",
    ".venv",
    "staticfiles",
    "media",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
    "DJ",  # flake8-django
    "PIE", # misc
    "SIM", # simplify
    "RUF",
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function call in default argument (Django: models.ForeignKey)
    "RUF001", # ambiguous unicode chars in russian text
    "RUF002",
    "RUF003",
    "DJ001",  # null=True for CharField — already used widely
]

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["E501", "S101"]
"**/migrations/*.py" = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
exclude = [
    "migrations/",
    ".venv/",
    "staticfiles/",
    "media/",
]

[[tool.mypy.overrides]]
module = "apps.*.migrations.*"
ignore_errors = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-q",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
