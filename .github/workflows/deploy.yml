name: Build and Auto Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/barkovyuri/barkova_app-backend
  IMAGE_FRONTEND: ghcr.io/barkovyuri/barkova_app-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_VK_APP_ID=54546774
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # ──────────────────────────────────────────────────────────────
      # Раньше сервер сам делал `git fetch origin main`, чтобы подтянуть
      # docker-compose.prod.yml и nginx-конфиг. Это переставало работать,
      # когда drone-ssh не мог из своей non-interactive shell-сессии
      # резолвить github.com (resolv.conf пуст или systemd-resolved тупит).
      # Теперь конфиги едут через scp с GH runner'а, а сервер только
      # тянет docker-образы из ghcr.io. Никакого git на сервере.
      # ──────────────────────────────────────────────────────────────

      - name: Checkout repository (для compose и nginx)
        uses: actions/checkout@v4

      - name: Copy compose and nginx configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/nginx/doctor.conf,deploy/nginx/limits.conf,backend/entrypoint.sh"
          target: "/var/www/barkova_app"
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          # Получатели алертов врачу: числовые id страниц VK через запятую.
          # Задаётся в GitHub: Settings, Secrets and variables, Actions
          # (подойдёт и Variable, и Secret).
          VK_DOCTOR_USER_IDS: ${{ vars.VK_DOCTOR_USER_IDS || secrets.VK_DOCTOR_USER_IDS }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 60m
          envs: VK_DOCTOR_USER_IDS
          script: |
            set -e
            cd /var/www/barkova_app

            # Записываем VK_DOCTOR_USER_IDS в .env, а не только в окружение
            # этого запуска: иначе ручной `docker compose up` на сервере
            # пересоздал бы контейнеры без получателей, и алерты врачу
            # молча перестали бы приходить.
            DOCTOR_IDS=$(printf '%s' "${VK_DOCTOR_USER_IDS:-}" | tr -d ' ')
            if [ -n "$DOCTOR_IDS" ]; then
              case "$DOCTOR_IDS" in
                *[!0-9,]*)
                  echo "VK_DOCTOR_USER_IDS: допустимы только цифры и запятые" >&2
                  exit 1
                  ;;
              esac
              if grep -q '^VK_DOCTOR_USER_IDS=' .env; then
                sed -i "s/^VK_DOCTOR_USER_IDS=.*/VK_DOCTOR_USER_IDS=${DOCTOR_IDS}/" .env
              else
                printf '\nVK_DOCTOR_USER_IDS=%s\n' "$DOCTOR_IDS" >> .env
              fi
            else
              echo "ВНИМАНИЕ: VK_DOCTOR_USER_IDS не задан в GitHub, оставляю значение из .env"
            fi

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u barkovyuri --password-stdin

            docker pull ghcr.io/barkovyuri/barkova_app-backend:latest
            docker pull ghcr.io/barkovyuri/barkova_app-frontend:latest

            docker compose -f docker-compose.prod.yml up -d --force-recreate \
              backend \
              celery_worker \
              celery_beat \
              frontend \
              nginx

            # Проверка канала алертов врачу: только статус, без отправки
            # сообщений. Результат виден в логе этого шага; деплой не валит.
            sleep 15
            docker compose -f docker-compose.prod.yml exec -T backend \
              python manage.py send_test_doctor_alert --check || true

            docker image prune -a -f || true
            docker builder prune -a -f || true
