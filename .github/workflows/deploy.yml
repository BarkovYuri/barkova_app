name: Build and Auto Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/barkovyuri/barkova_app-backend
  IMAGE_FRONTEND: ghcr.io/barkovyuri/barkova_app-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_VK_APP_ID=54546774
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      # ──────────────────────────────────────────────────────────────
      # Раньше сервер сам делал `git fetch origin main`, чтобы подтянуть
      # docker-compose.prod.yml и nginx-конфиг. Это переставало работать,
      # когда drone-ssh не мог из своей non-interactive shell-сессии
      # резолвить github.com (resolv.conf пуст или systemd-resolved тупит).
      # Теперь конфиги едут через scp с GH runner'а, а сервер только
      # тянет docker-образы из ghcr.io. Никакого git на сервере.
      # ──────────────────────────────────────────────────────────────

      - name: Checkout repository (для compose и nginx)
        uses: actions/checkout@v4

      - name: Copy compose and nginx configs to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml,deploy/nginx/doctor.conf,deploy/nginx/limits.conf,backend/entrypoint.sh"
          target: "/var/www/barkova_app"
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -e
            cd /var/www/barkova_app

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u barkovyuri --password-stdin

            docker pull ghcr.io/barkovyuri/barkova_app-backend:latest
            docker pull ghcr.io/barkovyuri/barkova_app-frontend:latest

            docker compose -f docker-compose.prod.yml up -d --force-recreate \
              backend \
              celery_worker \
              celery_beat \
              telegram_bot \
              frontend \
              nginx

            docker image prune -a -f || true
            docker builder prune -a -f || true
